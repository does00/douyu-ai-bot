# 首次使用：
#   1. cp .env.example .env                 # 填 WEBUI_PASSWORD 和 GEMINI_API_KEY
#   2. cp config.example.yaml config.yaml   # 填房间号和触发词
#   3. docker compose up -d --build
# Web 管理后台：http://<服务器IP>:18021（用户名 admin）
# 斗鱼扫码登录：在 WebUI「账号登录」卡片按账号扫码
services:
  douyu-ai-bot:
    build: .
    container_name: douyu-ai-bot
    restart: unless-stopped
    env_file: .env
    # 需要 HTTP 代理时加一行：- PROXY_URL=http://127.0.0.1:8080（environment 映射格式）
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.env:/app/.env:ro
      - ./data:/app/data

  douyu-ai-bot-webui:
    build: .
    container_name: douyu-ai-bot-webui
    restart: unless-stopped
    command: ["python", "webui.py"]
    env_file: .env
    environment:
      - WEBUI_HOST=0.0.0.0
      # 需要代理时取消注释
      # - PROXY_URL=http://127.0.0.1:8080
    ports:
      - "18021:18021"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./.env:/app/.env
      - ./data:/app/data
