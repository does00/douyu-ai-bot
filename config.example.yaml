# 复制为 config.yaml 后修改。不要提交 config.yaml 到 git。
# Copy to config.yaml and edit. Never commit config.yaml.
rooms:
  - id: '123456'            # 斗鱼房间号
    mode: contains          # contains=关键词包含；mention=@机器人 昵称
    keywords:
      - 小助手
      - 问一下
    offline_monitor: true   # 下播后是否继续监控
    enabled: true           # 手动启停
  # - id: '654321'
  #   mode: contains
  #   keywords:
  #     - 小助手
accounts:
  - name: 默认账号
    cookie_file: data/cookie.txt
    devid_file: data/devid.txt
gemini:
  model: gemini-3-flash-preview
  history_rounds: 6         # 每房间对话记忆轮数，0=关闭
  max_tokens: 150
  temperature: 0.9
  system: 你是直播间里的 AI 助手，用中文简短口语化回复，不超过 60 字。
